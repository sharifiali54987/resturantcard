<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700&display=swap">
<style>
:root{--bg:#f3f6fb;--c:#fff;--c2:#eef2f9;--tx:#0f172a;--mu:#64748b;--bd:#dbe3f0;--a:#3b82f6;--b:#8b5cf6;--f:Vazirmatn,Tahoma,system-ui,sans-serif;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#060d20;--c:#0c1736;--c2:#111f44;--tx:#e8eeff;--mu:#8a9bc4;--bd:#1d2e5c}}
:root[data-theme="dark"]{--bg:#060d20;--c:#0c1736;--c2:#111f44;--tx:#e8eeff;--mu:#8a9bc4;--bd:#1d2e5c}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.7 var(--f);-webkit-text-size-adjust:100%}
body:before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(700px 500px at 15% 0,color-mix(in srgb,var(--a) 18%,transparent),transparent),radial-gradient(700px 500px at 85% 100%,color-mix(in srgb,var(--b) 20%,transparent),transparent)}
a{color:inherit;text-decoration:none;cursor:pointer}
.app{max-width:470px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;background:var(--bg)}
@media(min-width:600px){.app{min-height:calc(100vh - 48px);margin:24px auto;border:1px solid var(--bd);border-radius:32px;box-shadow:0 20px 60px #0006}}
.scr{flex:1;padding:0 16px 16px}
.nav{position:sticky;bottom:0;display:flex;background:var(--nav,var(--c));border-top:1px solid var(--bd);padding:8px 4px calc(8px + env(safe-area-inset-bottom,0px));z-index:5;border-radius:0 0 31px 31px}
.nav a{flex:1;text-align:center;font-size:11px;color:var(--mu)}.nav a.on{color:var(--at,var(--a));font-weight:700}.nav i{display:block;font-style:normal;font-size:20px}
.cov{height:150px;margin:0 -16px;background:linear-gradient(135deg,#1e3a8a,#6d28d9 60%,#0ea5e9) center/cover;padding:14px 16px;border-radius:0 0 30px 30px}
@media(min-width:600px){.cov{border-radius:31px 31px 30px 30px}}
.tb{display:flex;justify-content:space-between;align-items:center;color:#fff;letter-spacing:2px}
.ib{border:1px solid var(--bd);background:var(--c2);color:var(--tx);border-radius:12px;padding:5px 12px;cursor:pointer;font:inherit}
.tb .ib{background:#0006;color:#fff;border-color:#fff3}
.ctr{text-align:center}.sub{color:var(--mu)}.tl{color:var(--at,var(--a));font-weight:700}
.av{width:112px;height:112px;border-radius:50%;padding:4px;background:linear-gradient(135deg,var(--a),var(--b));margin:-56px auto 8px;position:relative}
.av img,.av b{width:100%;height:100%;border-radius:50%;object-fit:cover;background:var(--c2);display:grid;place-items:center;font-size:40px}
h1{margin:0;font-size:21px}h2.ph{text-align:center;font-size:18px;margin:16px 0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);margin:12px 0;text-align:center}.stats b{display:block;font-size:20px}.stats span{color:var(--mu);font-size:12px}
.btn{display:block;width:100%;padding:12px;border:0;border-radius:14px;color:var(--btn,#fff);background:linear-gradient(90deg,var(--a),var(--b));font:inherit;font-weight:700;cursor:pointer;text-align:center}.btn.o{background:var(--c);border:1px solid var(--bd);color:var(--tx)}
.two{display:grid;grid-template-columns:1.4fr 1fr;gap:10px;margin-bottom:12px}
.tls{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tl2{background:var(--c);border:1px solid var(--bd);border-radius:18px;padding:12px 4px;text-align:center;font-size:12px}
.tl2 i{width:50px;height:50px;border-radius:50%;margin:0 auto 4px;display:grid;place-items:center;color:#fff;font-style:normal;font-size:20px}.tl2 svg{width:22px;height:22px}
.cd{background:var(--c);border:1px solid var(--bd);border-radius:20px;padding:16px;margin-bottom:12px}
.cd h3{margin:0 0 10px;font-size:15px}
.it{display:flex;gap:12px;align-items:center}.it b{display:block}.it small{display:block;color:var(--mu)}.it em{color:var(--at,var(--a));font-style:normal;font-size:12px}
.th{width:92px;height:76px;border-radius:14px;background:linear-gradient(135deg,var(--a),var(--b)) center/cover;flex:none;display:grid;place-items:center;font-size:26px}
.chips{display:flex;gap:8px;overflow-x:auto;margin-bottom:12px}.chips a{flex:none;border:1px solid var(--bd);background:var(--c);border-radius:20px;padding:4px 16px}.chips a.on{background:linear-gradient(90deg,var(--a),var(--b));color:var(--btn,#fff)}
.pg{display:grid;grid-template-columns:1fr 1fr;gap:10px}.pi{aspect-ratio:1;border-radius:18px;background:linear-gradient(135deg,var(--b),var(--a)) center/cover;display:flex;align-items:flex-end;padding:8px}.pi span{background:#000a;color:#fff;border-radius:10px;padding:1px 10px;font-size:12px}
.row{display:flex;align-items:center;gap:12px;padding:9px 4px;border-bottom:1px solid var(--bd)}.row:last-child{border:0}.row>div{flex:1;min-width:0}
.row small{display:block;color:var(--mu);direction:ltr;text-align:start;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:#fff;font:700 11px/1 var(--f);font-style:normal;flex:none}.ic svg{width:22px;height:22px}
.tag{display:inline-block;border:1px solid var(--bd);background:var(--c2);border-radius:8px;padding:2px 10px;margin:3px;font-size:12px}
.qr{display:grid;place-items:center;background:#fff;border-radius:14px;padding:10px;width:fit-content;margin:auto}
input,textarea,select{width:100%;background:var(--c2);border:1px solid var(--bd);color:var(--tx);border-radius:12px;padding:10px;font:inherit;margin:4px 0 8px}
input[type=checkbox]{width:auto;margin:0;accent-color:var(--at,var(--a));transform:scale(1.3)}input[type=color]{height:42px;padding:3px}
label{font-size:12px;color:var(--mu)}.ft{display:block;text-align:center;color:var(--mu);font-size:12px;padding:6px}
.adm{display:grid;min-height:100vh;grid-template-columns:210px minmax(0,1fr)}
.side{background:var(--c);border-inline-end:1px solid var(--bd);padding:16px;position:sticky;top:0;height:100vh;overflow:auto}
